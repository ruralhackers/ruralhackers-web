# Static build. No SSR adapter, so no @astrojs/netlify.
[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.3.14"

# Astro fingerprints everything under _astro, so those are safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# WordPress's uploads, theme and core files, at their original paths. Not
# fingerprinted, but an upload never changes once published (WordPress gives a
# replacement a new name), so a week is safe, then revalidate in the background.
[[headers]]
  for = "/wp-content/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/wp-includes/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Html must revalidate, or a deploy would not reach anyone holding a cached copy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
