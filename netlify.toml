# Static build. No SSR adapter, so no @astrojs/netlify.
[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.3.14"

# Astro fingerprints everything under _astro, so those are safe to cache forever.
# This is what makes a second visit instant: 297 KB of fonts and images on a first
# load, and nothing on a repeat one.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The favicons are not fingerprinted — they are referenced from <head> at fixed
# paths — so they get a day rather than a year.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Html must revalidate, or a deploy would not reach anyone holding a cached copy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
